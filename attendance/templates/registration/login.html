{% extends "attendance/base.html" %}
{% block content %}
<div class="mx-auto mt-10 max-w-sm">
  <div class="card p-7">
    <h1 class="text-xl font-semibold text-slate-900">Sign in</h1>
    <p class="mb-5 mt-1 text-sm text-slate-500">Attendance Hub</p>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {% if form.errors %}<p class="alert alert-err">Wrong username or password.</p>{% endif %}
      <label class="field"><span class="lbl">Username</span>{{ form.username }}</label>
      <label class="field"><span class="lbl">Password</span>{{ form.password }}</label>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-full">Sign in</button>
    </form>
  </div>
  <p class="mt-3 text-center text-xs text-slate-400">Create a user: <code>python manage.py createsuperuser</code></p>
</div>
{% endblock %}
